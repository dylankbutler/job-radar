name: Refresh Job Radar

on:
  schedule:
    # 15:00 UTC ≈ 7-8am Pacific depending on daylight saving
    - cron: '0 15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run refresh script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/refresh.mjs

      - name: Commit updated data
        run: |
          git config user.name "job-radar-bot"
          git config user.email "actions@github.com"
          git add data/jobs.json
          git diff --staged --quiet || git commit -m "Auto-refresh job data"
          git push
